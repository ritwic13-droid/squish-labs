<style>
/* squish.labs in the Specimen brand language (brand-languages/specimen): a materials lab. Hairlines, square corners, mono
   labels, one signal pink for whatever is being measured; presses invert instantly, nothing bounces. Dark first: Darkroom is the
   default, Bench (light) via <html data-theme="light"> (for the settings page to come).
   Layout: one full-bleed WebGL stage on a measuring grid; the caption top-left, the control panel docked right (stacks on phones) */
:root{
  --surface:#111315; --raised:#1a1d20; --grid:#1f2427;
  --ink:#eceee9; --muted:#9ba2a8; --line:#2c3236; --rule:#6f777d;
  --signal:#ff5c9a; --on-signal:#15171a; --caution:#ffd23f; --agar:#2c4a45;
  /* older names the script still reads */
  --ground:var(--surface); --ground-hi:var(--raised); --chip:var(--raised); --chip-ink:var(--ink); --accent:var(--signal); --on-accent:var(--on-signal); --panel:var(--raised);
  --f-display:"Martian Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-body:"Hanken Grotesk","Segoe UI",system-ui,sans-serif;
  --f-mono:"Martian Mono",ui-monospace,Menlo,Consolas,monospace;
  --dur-tick:80ms; --dur-step:140ms; --ease-exact:cubic-bezier(.2,0,0,1);
  --panel-w:316px;
  /* the portfolio hand-off: the colours on screen at the moment of entry (?from=portfolio), for the portfolio's transition to end on.
     The fluid is the signal pink, shaded from deep to light; it settles over the ground colour */
  --plinth:#2a1640;  /* the plinth top: deep purple jelly */
  --squish-entry-fluid:#ff5c9a; --squish-entry-fluid-deep:#801441; --squish-entry-fluid-light:#ffcbdf; --squish-entry-ground:#111315;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --surface:#f2f2ee; --raised:#ffffff; --grid:#e1e3de; --ink:#15171a; --muted:#565c62; --line:#d3d6d1; --rule:#767c82;
  --signal:#c8195f; --on-signal:#ffffff; --agar:#bfd8d2; color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--surface);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 14px;gap:10px;box-sizing:border-box}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:44px}
/* the lockup: the element tile (Sq, 02), then the wordmark at 62% of its height */
.brand{flex:1 0 auto;display:flex;align-items:center;gap:12px}
.brand svg{display:block;height:38px;width:auto}
.brand .logo-word{height:22px}
.lg-ink{fill:var(--ink)} .lg-brand{fill:var(--signal)} .lg-muted{fill:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* controls: square, 1px rule, uppercase labels; hover darkens the border, a press inverts instantly and never moves */
.btn,.sound,.sound-more{font:600 12px/16px var(--f-body);letter-spacing:.08em;text-transform:uppercase;background:var(--raised);color:var(--ink);border:1px solid var(--rule);border-radius:2px;padding:9px 12px;min-height:36px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;transition:background-color var(--dur-step) var(--ease-exact),color var(--dur-step) var(--ease-exact),border-color var(--dur-step) var(--ease-exact)}
.btn:hover,.sound:hover,.sound-more:hover{border-color:var(--ink)}
.btn:active,.sound:active,.sound-more:active{background:var(--ink);color:var(--surface);transition-duration:var(--dur-tick)}
.btn.on{background:var(--signal);border-color:var(--signal);color:var(--on-signal)}
.btn:focus-visible,.sound:focus-visible,.sound-more:focus-visible,.seg button:focus-visible,input:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.sound{width:36px;padding:0;display:grid;place-items:center}
.sound svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter}
.sound .wave{stroke:var(--signal)}
.sound .ico-off,.sound[aria-pressed="false"] .ico-on{display:none}
.sound[aria-pressed="false"] .ico-off{display:inline}
.sound[aria-pressed="false"]{color:var(--muted)}
.sound-more{width:24px;padding:0;margin-left:-1px;display:grid;place-items:center}
.sound-more::after{content:"";width:5px;height:5px;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:translateY(-2px) rotate(45deg)}
.sound-more[aria-expanded="true"]::after{transform:translateY(1px) rotate(-135deg)}
.sound-menu{position:relative;display:flex}
.sound-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:250px;max-width:calc(100vw - 32px);background:var(--raised);border:1px solid var(--rule);border-radius:0;padding:14px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.quality{width:132px}
/* the stage: the darkroom with its 16px measuring grid, framed by a rule */
.stage{position:relative;flex:1;min-height:0;border:1px solid var(--rule);overflow:hidden;background-color:var(--surface)}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px}
/* entering after the landing: the grid spreads out from the stage centre with a soft edge (--gr is its radius, set per frame) */
.lab-enter .stage::before{-webkit-mask-image:radial-gradient(circle at 50% 55%,#000 calc(var(--gr,0px) - 160px),transparent var(--gr,0px));mask-image:radial-gradient(circle at 50% 55%,#000 calc(var(--gr,0px) - 160px),transparent var(--gr,0px))}
.viewport{position:absolute;inset:0}
/* a gentle lens vignette over the frame (CSS: costs no GPU time) */
.viewport::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 110% at 45% 50%,transparent 58%,rgba(0,0,0,.26))}
#gl{display:block;width:100%;height:100%;touch-action:none;cursor:grab;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}  /* long-press squeezes, so no iOS callout or text selection */
#gl.interact{cursor:default}
#gl:active{cursor:grabbing}
.caption{position:absolute;left:28px;top:24px;max-width:330px;pointer-events:none;display:flex;flex-direction:column;gap:8px}
.kicker{font:600 12px/16px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.caption h1{font-family:var(--f-display);font-weight:600;font-size:clamp(32px,3.6vw,52px);line-height:1;letter-spacing:-.03em;margin:0 0 4px;white-space:nowrap}
.caption h1 em{font-style:normal;color:var(--signal)}
.blurb{margin:0;font:400 15px/22px var(--f-body);color:var(--ink);max-width:36ch}
.hint{margin:2px 0 0;font:400 13.5px/20px var(--f-body);color:var(--muted);max-width:38ch}
.panel{position:absolute;right:0;top:0;bottom:0;width:var(--panel-w);background:var(--raised);border-left:1px solid var(--rule);overflow:auto;padding:12px 14px 10px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.p-head{display:flex;justify-content:space-between;align-items:baseline}
.eyebrow{font:600 12px/16px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fps{font:500 10px/14px var(--f-mono);letter-spacing:.1em;color:var(--muted);font-variant-numeric:tabular-nums}
.group{display:flex;flex-direction:column;gap:9px;padding-top:10px;border-top:1px solid var(--rule)}
.group:first-of-type{border-top:0;padding-top:0}
.row{display:flex;flex-direction:column;gap:2px}
.row-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.row label,.lbl{font:600 12px/16px var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.val{font:500 13px/16px var(--f-mono);color:var(--signal);font-variant-numeric:tabular-nums;white-space:nowrap}
/* the measuring slider: a 1px track with ticks every 10%, a signal line up to the value (--fill, kept by the script), a needle */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;margin:0;background:linear-gradient(var(--signal),var(--signal)) 0 50%/var(--fill,50%) 2px no-repeat,repeating-linear-gradient(90deg,var(--rule) 0 1px,transparent 1px 10%) 0 100%/100% 6px no-repeat,linear-gradient(var(--rule),var(--rule)) 0 50%/100% 1px no-repeat;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:4px;height:20px;border-radius:1px;background:var(--ink);box-shadow:0 0 0 2px var(--raised)}
input[type=range]:active::-webkit-slider-thumb{background:var(--signal)}
input[type=range]::-moz-range-thumb{width:4px;height:20px;border:0;border-radius:1px;background:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:0;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.seg button{font:600 11px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;background:var(--raised);color:var(--ink);border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);border-radius:0;padding:6px 4px;min-height:28px;cursor:pointer;min-width:0;transition:background-color var(--dur-step) var(--ease-exact)}
.seg button:hover{background:var(--surface)}
.seg-fill{background:var(--raised);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.seg button:active{background:var(--ink);color:var(--surface);transition-duration:var(--dur-tick)}
.seg button[aria-pressed="true"]{color:var(--signal);box-shadow:inset 0 0 0 2px var(--signal)}
/* the toy picker: one flush grid of numbered sample slots sharing hairlines; the selected slot framed in signal */
.seg:has(.has-ico){grid-auto-rows:1fr;counter-reset:sample}
.seg button.has-ico{counter-increment:sample;position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:2px;padding:6px 7px 7px;text-align:left;font:500 11.5px/1.2 var(--f-body);letter-spacing:0;text-transform:none}
.seg button.has-ico::before{content:counter(sample,decimal-leading-zero);position:absolute;top:6px;right:7px;font:500 9.5px/12px var(--f-mono);letter-spacing:.1em;color:var(--muted)}
.seg button.has-ico[aria-pressed="true"]::before{color:var(--signal)}
.seg button .ico{display:block;width:36px;height:36px;flex:none;pointer-events:none}
.colors{display:flex;gap:12px;flex-wrap:wrap}
.swatch{display:flex;align-items:center;gap:7px;font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.swatch input{width:30px;height:22px;border:1px solid var(--rule);border-radius:2px;padding:0;background:none;cursor:pointer}
.toggle{display:flex;align-items:center;justify-content:space-between;font:600 12px/16px var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.toggle input{accent-color:var(--signal);width:16px;height:16px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
/* readouts: a ruled table, label left, value right */
.readouts{display:grid;grid-template-columns:1fr;margin:0;border-top:1px solid var(--rule)}
.readouts div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0;padding:4px 0;border-bottom:1px solid var(--line)}
.readouts dt{font:600 11px/14px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.readouts dd{margin:0;font:500 16px/1.15 var(--f-mono);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{display:flex;gap:6px}
.foot .btn{flex:1}
/* a toast is one log line: mono, a signal dot, a hairline box; it appears and leaves without animation */
.toast{position:absolute;left:50%;bottom:20px;translate:calc(-50% - var(--panel-w)/2) 0;display:flex;align-items:center;gap:8px;background:var(--raised);color:var(--ink);border:1px solid var(--rule);border-radius:4px;font:500 13px/18px var(--f-body);padding:8px 12px;opacity:0;pointer-events:none;white-space:nowrap}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--signal);flex:none}
.toast.show{opacity:1}
.toast.long{white-space:normal;width:max-content;max-width:min(560px, calc(100% - 40px - var(--panel-w)));line-height:1.45}
.fallback{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
@media (max-width:860px){
  html,body{height:auto}
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .stage{display:flex;flex-direction:column;overflow:visible;background:none;border:0}
  .stage::before{display:none}
  .caption{position:static;max-width:none;padding:6px 0 10px;order:-1}
  .caption h1{font-size:32px}
  .hint{display:none}
  .brand .logo-word{display:none}
  .viewport{position:relative;inset:auto;height:62vh;min-height:320px;border:1px solid var(--rule);overflow:hidden;background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px}
  .panel{position:static;width:auto;margin-top:12px;max-height:none;overflow:visible;border:1px solid var(--rule)}
  .toast{bottom:auto;top:calc(62vh - 40px);translate:-50% 0}
}
@media (prefers-reduced-motion:reduce){.btn,.sound,.seg button{transition:none}}
/* landing: while three.js and the toy load, a specimen assembles itself on the measuring grid (pixels converge, lobes fuse, the
   pixel grid resolves to a smooth form), driven by the real loading steps; then it loops slowly, buds off the Start button, and on
   Start settles onto the plinth and dissolves into the lab. Drawn by its own small WebGL2 canvas, so it runs before three.js arrives */
.intro{position:fixed;inset:0;z-index:40;overflow:hidden;color:var(--ink);font-family:var(--f-mono)}
.intro:focus{outline:none}
.intro-bg{position:absolute;inset:0;background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px}
#intro-gl{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.intro-bar{position:absolute;top:10px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.intro-bar h1{margin:0;font-size:inherit}
.intro-bar .brand{flex:none}
.intro-tag{margin:0;font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
/* construction hairlines: a crosshair through the specimen and a measuring frame with corner nodes, drawn in as it loads */
.intro-x,.intro-y{position:absolute;background:var(--line)}
.intro-x{left:0;right:0;top:var(--cy);height:1px;transform-origin:var(--cx) 0;transform:scaleX(var(--draw,1))}
.intro-y{top:0;bottom:0;left:var(--cx);width:1px;transform-origin:0 var(--cy);transform:scaleY(var(--draw,1))}
.intro-frame{position:absolute;left:calc(var(--cx) - var(--fr));top:calc(var(--cy) - var(--fr));width:calc(var(--fr) * 2);height:calc(var(--fr) * 2);border:1px solid var(--rule);opacity:var(--draw,1);box-sizing:border-box}
.intro-frame i{position:absolute;width:5px;height:5px;background:var(--ink)}
.intro-frame i:nth-child(1){left:-3px;top:-3px} .intro-frame i:nth-child(2){right:-3px;top:-3px} .intro-frame i:nth-child(3){left:-3px;bottom:-3px} .intro-frame i:nth-child(4){right:-3px;bottom:-3px}
.intro-frame span{position:absolute;font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.intro-frame::before,.intro-frame::after{content:"";position:absolute;left:0;right:0;height:6px;background:repeating-linear-gradient(90deg,var(--rule) 0 1px,transparent 1px 10%)}
.intro-frame::before{top:0} .intro-frame::after{bottom:0}
.intro-frame .tl{left:0;top:-18px} .intro-frame .tr{right:0;top:-18px} .intro-frame .bl{left:0;bottom:-18px} .intro-frame .br{right:0;bottom:-18px;font-variant-numeric:tabular-nums}
.intro-meta{position:absolute;left:var(--cx);top:var(--my);transform:translateX(-50%);text-align:center;white-space:nowrap}
.intro-count{position:relative;font:600 44px/44px var(--f-display);letter-spacing:.04em;font-variant-numeric:tabular-nums;transition:opacity 300ms var(--ease-exact)}
.intro-num{position:absolute;left:50%;top:0;width:360px;height:76px;transform:translateX(-50%);pointer-events:none}
.intro.wnum .intro-count,.intro.wnum .intro-count .z,.intro.wnum .intro-status{color:transparent}  /* the drawn counter shows; the text stays for assistive tech */
.intro-count .z{color:var(--line)}
.intro-status{margin:18px 0 0;font:500 11px/1.4 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);transition:transform 300ms var(--ease-exact)}
.intro.ready .intro-count{opacity:0}
.intro.ready .intro-status{opacity:0}
/* Start: a filled signal key, square like every control; hover darkens the border, a press inverts instantly */
.intro-start{position:absolute;left:var(--cx);top:var(--by);transform:translate(-50%,-50%);height:56px;min-width:224px;padding:0 32px;font:600 14px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;background:none;color:var(--on-signal);border:0;border-radius:999px;cursor:pointer;visibility:hidden;opacity:0;transition:opacity var(--dur-step) var(--ease-exact)}
.intro-start.in{visibility:visible;opacity:1}
/* the key's body is the blob's jelly, drawn by the landing's shader (it swells on hover and squashes when pressed); this is its label */
.intro-start:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.intro.out .intro-meta,.intro.out .intro-x,.intro.out .intro-y{opacity:0;transition:opacity 140ms var(--ease-exact)}
/* the frame stays: after the landing it grows into the stage's border; its labels go, its corner nodes travel with it */
.intro-frame.grow{transition:left 1000ms cubic-bezier(.65,0,.35,1),top 1000ms cubic-bezier(.65,0,.35,1),width 1000ms cubic-bezier(.65,0,.35,1),height 1000ms cubic-bezier(.65,0,.35,1)}
.intro-frame.grow span{opacity:0;transition:opacity 300ms} .intro-frame.grow::before,.intro-frame.grow::after{opacity:0;transition:opacity 300ms}
.intro-reveal .intro-bar{opacity:0;transition:opacity 300ms}
.intro-reveal .app .bar{transition-delay:140ms}
.intro.fade{opacity:0;transition:opacity 320ms linear}
.intro.audit .intro-bar,.intro.audit .intro-meta,.intro.audit .intro-frame,.intro.audit .intro-x,.intro.audit .intro-y{display:none}
.intro.audit .intro-start{opacity:0!important;transition:none} .intro.audit .intro-bg{background-image:none}
/* the lab's chrome waits under the landing and fades in as the specimen lands */
.intro-on .app .bar,.intro-on .app .caption,.intro-on .app .panel{opacity:0}
/* entry from the portfolio: the screen is the fluid until the landing's renderer draws its first frame (the fluid, full screen, then
   settling into the blob); the landing's labels come in as it settles */
html.entry,html.entry body{background:var(--squish-entry-fluid)}
html.entry .intro .intro-bg{background:var(--squish-entry-fluid)} html.entry .intro.settled .intro-bg{background-color:var(--surface);transition:background-color 300ms}
html.entry #intro-gl{opacity:0;transition:opacity 400ms ease-out} html.entry .intro.drawn #intro-gl{opacity:1}  /* the drawn fluid fades in over the painted one */
html.entry .intro:not(.out) :is(.intro-bar,.intro-meta,.intro-frame,.intro-x,.intro-y){opacity:var(--chrome,0)}
.intro-on .app .panel{transform:translateY(-110%)} .intro-on .app .caption{transform:translateX(-110%)}  /* they slide in as the frame grows */
.intro-reveal .app .bar,.intro-reveal .app .caption,.intro-reveal .app .panel{opacity:1;transform:none;transition:opacity 500ms cubic-bezier(.4,0,.2,1),transform 1000ms cubic-bezier(.65,0,.35,1)}
@media (prefers-reduced-motion:reduce){.intro-start,.intro-count,.intro-status{transition:none}}
</style>
